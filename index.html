<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopLite · 简易在线商品展示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ 顶部导航栏：Logo + 搜索框 + 购物车 ============ -->
  <header class="header">
    <div class="header__inner container">
      <a href="#" class="header__logo">
        Shop<span class="text-primary">Lite</span>
      </a>

      <div class="header__search">
        <input
          id="searchInput"
          class="header__search-input"
          type="text"
          placeholder="搜索商品名称或分类..."
          autocomplete="off">
        <button id="searchBtn" class="header__search-btn btn-primary" type="button">搜索</button>
      </div>

      <button id="cartBtn" class="header__cart" type="button">
        <span class="header__cart-icon">🛒</span>
        <span class="header__cart-text">购物车</span>
        <span id="cartCount" class="header__cart-count badge">0</span>
      </button>
    </div>
  </header>

  <!-- ============ 分类导航（由 JS 动态渲染） ============ -->
  <nav class="category">
    <ul id="categoryList" class="category__list container"><!-- JS 注入分类项 --></ul>
  </nav>

  <!-- ============ 轮播图：3 秒自动切换 + 左右箭头 ============ -->
  <section class="carousel container container--flush card" aria-label="推荐轮播">
    <div class="carousel__viewport">
      <div id="carouselTrack" class="carousel__track"><!-- JS 注入幻灯片 --></div>
    </div>

    <button id="prevBtn" class="carousel__arrow carousel__arrow--prev btn-icon" type="button" aria-label="上一张">‹</button>
    <button id="nextBtn" class="carousel__arrow carousel__arrow--next btn-icon" type="button" aria-label="下一张">›</button>

    <div id="carouselDots" class="carousel__dots"><!-- JS 注入指示点 --></div>
  </section>

  <!-- ============ 商品网格 ============ -->
  <main class="main container">
    <div class="main__head">
      <h2 id="sectionTitle" class="main__title">全部商品</h2>
      <p id="resultCount" class="main__count"></p>
    </div>

    <div id="productGrid" class="product-grid"><!-- JS 注入商品卡片 --></div>

    <p id="emptyTip" class="main__empty">没有找到匹配的商品，换个关键词试试～</p>
  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="footer">
    <div class="footer__inner container">
      <div class="footer__col footer__col--brand">
        <h4 class="footer__title">
          Shop<span class="text-primary">Lite</span>
        </h4>
        <p class="footer__desc">简易在线商品展示页 · 原生 HTML / CSS / JS 实现</p>
      </div>

      <div class="footer__col">
        <h4 class="footer__title">购物指南</h4>
        <ul class="footer__list">
          <li class="footer__item" data-action="coming-soon">如何下单</li>
          <li class="footer__item" data-action="coming-soon">配送说明</li>
          <li class="footer__item" data-action="coming-soon">支付方式</li>
        </ul>
      </div>

      <div class="footer__col">
        <h4 class="footer__title">售后服务</h4>
        <ul class="footer__list">
          <li class="footer__item" data-action="coming-soon">七天无理由退货</li>
          <li class="footer__item" data-action="coming-soon">正品保障</li>
          <li class="footer__item" data-action="coming-soon">保修政策</li>
        </ul>
      </div>

      <div class="footer__col">
        <h4 class="footer__title">联系我们</h4>
        <ul class="footer__list">
          <li class="footer__item">客服热线：400-000-0000</li>
          <li class="footer__item">邮箱：support@shoplite.demo</li>
          <li class="footer__item">工作日 9:00 - 18:00</li>
        </ul>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copyright container">© 2026 ShopLite 演示站点 · 仅供学习交流使用</p>
    </div>
  </footer>

  <!-- ============ 商品详情弹窗（遮罩层 + 内容框 + 关闭按钮） ============ -->
  <div id="modal" class="modal" aria-hidden="true">
    <!-- 遮罩层：点击任意位置关闭 -->
    <div class="modal__mask overlay" data-close="true"></div>

    <div class="modal__box card" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="modal__close btn-icon" type="button" data-close="true" aria-label="关闭弹窗">×</button>

      <div class="modal__media">
        <img id="modalImage" class="modal__image img-cover" src="" alt="">
      </div>

      <div class="modal__body">
        <span id="modalCategory" class="modal__badge badge">分类</span>
        <h3 id="modalName" class="modal__name">商品名称</h3>
        <p id="modalPrice" class="modal__price text-primary">¥0.00</p>
        <p class="modal__label">商品简介</p>
        <p id="modalDesc" class="modal__desc">暂无简介</p>
        <button id="modalAdd" class="modal__add btn-primary" type="button">加入购物车</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
